<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Deep Sapphire-Night Background -->
    <linearGradient id="bgGrad" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#1e3a6e"/>
      <stop offset="48%" stop-color="#0f1c38"/>
      <stop offset="100%" stop-color="#080e1d"/>
    </linearGradient>

    <!-- Subtle Cyan Top-Left Ambient Light -->
    <radialGradient id="cyanGlow" cx="0.22" cy="0.18" r="0.65">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <!-- Warm Gold Center Aura -->
    <radialGradient id="goldAura" cx="0.52" cy="0.52" r="0.44">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.24"/>
      <stop offset="55%" stop-color="#f59e0b" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Luminous Gold Emblem Gradient -->
    <linearGradient id="goldGrad" x1="0.2" y1="0.05" x2="0.8" y2="0.95">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="28%" stop-color="#fde047"/>
      <stop offset="68%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Border Rim Highlight -->
    <linearGradient id="rimGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#fbbf24" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Soft Shadow under Emblem -->
    <filter id="emblemShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#020617" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Squircle Icon Base -->
  <rect x="44" y="44" width="936" height="936" rx="224" fill="url(#bgGrad)"/>
  <rect x="44" y="44" width="936" height="936" rx="224" fill="url(#cyanGlow)"/>
  <rect x="44" y="44" width="936" height="936" rx="224" fill="url(#goldAura)"/>

  <!-- Fine Inner Frame & Subtle Geometric Rings -->
  <rect x="44" y="44" width="936" height="936" rx="224" fill="none" stroke="url(#rimGrad)" stroke-width="6"/>
  <rect x="76" y="76" width="872" height="872" rx="194" fill="none" stroke="#94a3b8" stroke-opacity="0.12" stroke-width="2.5"/>

  <circle cx="512" cy="512" r="326" fill="none" stroke="#fbbf24" stroke-opacity="0.14" stroke-width="2.5" stroke-dasharray="12 16"/>
  <circle cx="512" cy="512" r="260" fill="none" stroke="#38bdf8" stroke-opacity="0.12" stroke-width="2"/>

  <!-- Subtle Corner Accent Dots -->
  <circle cx="512" cy="186" r="5" fill="#fde047" fill-opacity="0.45"/>
  <circle cx="512" cy="838" r="5" fill="#38bdf8" fill-opacity="0.4"/>

  <!-- Custom Sculpted Calligraphic Vector Alef (א) -->
  <g filter="url(#emblemShadow)">
    <!-- Main Diagonal Spine (top-left to bottom-right) -->
    <path
      d="M 286 290 C 314 266 346 276 374 312 L 668 674 C 698 710 726 716 742 738 C 756 756 738 784 708 784 C 674 784 646 754 614 714 L 320 352 C 294 320 264 310 286 290 Z"
      fill="url(#goldGrad)"
    />
    <!-- Upper-Right Curved Arm (from top-right down-left into spine center) -->
    <path
      d="M 656 248 C 696 242 732 268 726 308 C 718 364 672 434 574 494 C 548 510 526 508 514 492 C 502 476 510 454 532 436 C 594 384 632 336 632 296 C 632 272 634 252 656 248 Z"
      fill="url(#goldGrad)"
    />
    <!-- Lower-Left Curved Leg (from spine upper-left down-left to foot) -->
    <path
      d="M 454 504 C 468 520 462 546 438 570 C 384 624 358 672 362 714 C 366 746 348 780 314 780 C 282 780 264 750 272 706 C 284 636 334 558 408 504 C 428 490 442 492 454 504 Z"
      fill="url(#goldGrad)"
    />
    <!-- Subtle Specular Highlight Accent on Spine -->
    <path
      d="M 332 308 L 656 706"
      stroke="#fffbeb"
      stroke-opacity="0.32"
      stroke-width="10"
      stroke-linecap="round"
      fill="none"
    />
  </g>

  <!-- Small Cyan Spark Accent (top-right) -->
  <path
    d="M 792 214 L 800 234 L 820 242 L 800 250 L 792 270 L 784 250 L 764 242 L 784 234 Z"
    fill="#7dd3fc"
    fill-opacity="0.85"
  />
</svg>
