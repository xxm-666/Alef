name: Build Alef iOS IPA

on:
  workflow_dispatch:
    inputs:
      toolchain:
        description: Xcode version to build with
        type: choice
        options:
          - Xcode 27
          - Xcode 26 (Intel)
        default: Xcode 27

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ inputs.toolchain == 'Xcode 26 (Intel)' && 'macos-26-intel' || 'xcode-27' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Prepare native study content and audio
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: |
          npm ci --replace-registry-host=always
          npm run prepare:ios

      - name: Build unsigned device app
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/alef-ios" \
            CODE_SIGNING_ALLOWED=NO build

      - name: Package IPA with the daily letter widget
        run: |
          app="$RUNNER_TEMP/alef-ios/Build/Products/Release-iphoneos/App.app"
          test -s "$app/StudyAssets/content.json"
          test -s "$app/StudyAssets/GveretLevin-Regular.ttf"
          test -s "$app/StudyAssets/audio/he_2e0fc6efece8.mp3"
          test -s "$app/StudyAssets/audio/correct.wav"
          test -x "$app/PlugIns/DailyLetterWidget.appex/DailyLetterWidget"
          mkdir Payload
          ditto "$app" Payload/App.app
          ditto -c -k --keepParent Payload Alef.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Alef-iOS
          path: Alef.ipa
          if-no-files-found: error
